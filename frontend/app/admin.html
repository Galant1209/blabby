    activateWritingView(state.writingView || 'submissions');
  }

  const TASK1_REVIEW_STATUSES = [
    ['pending', 'Pending'],
    ['needs_fix', 'Needs fix'],
    ['approved', 'Approved for engineering reactivation'],
    ['retired', 'Retired'],
    ['all', 'All'],
  ];
  const TASK1_REVIEW_ISSUES = [
    ['', 'No category'],
    ['renderer_unsupported', 'Renderer unsupported'],
    ['data_shape_invalid', 'Data shape invalid'],
    ['misleading_visual', 'Misleading visual'],
    ['label_collision', 'Label collision'],
    ['unreadable', 'Unreadable'],
    ['content_issue', 'Content issue'],
    ['other', 'Other'],
  ];

  function reviewStatusClass(status) {
    if (status === 'approved') return 'valid';
    if (status === 'needs_fix') return 'partial';
    if (status === 'retired') return 'invalid';
    return 'tag';
  }

  function reviewStatusLabel(status) {
    const match = TASK1_REVIEW_STATUSES.find(([value]) => value === status);
    return match ? match[1] : status || 'Pending';
  }

  async function loadTask1Review() {
    const host = $('writing-content');
    host.innerHTML = '<div class="col__empty">Loading Task 1 review queue…</div>';
    try {
      const filter = state.task1ReviewFilter || 'pending';
      const res = await fetch(`${API_BASE}/admin/writing/task1-review?review_status=${encodeURIComponent(filter)}`, {
        headers: { 'Authorization': `Bearer ${state.token}` },
      });
      if (!res.ok) {
        host.innerHTML = `<div class="col__empty">Failed to load (${res.status})</div>`;
        return;
      }
      const data = await res.json();
      state.task1ReviewRows = data.questions || [];
      state.selectedTask1ReviewId = state.task1ReviewRows.some(q => q.question_id === state.selectedTask1ReviewId)
        ? state.selectedTask1ReviewId
        : (state.task1ReviewRows[0]?.question_id || null);
      renderTask1ReviewQueue();
    } catch (err) {
      console.error('loadTask1Review error', err);
      host.innerHTML = '<div class="col__empty">Network error</div>';
    }
  }

  function renderTask1ReviewQueue() {
    const host = $('writing-content');
    const rows = state.task1ReviewRows || [];
    const selectedId = state.selectedTask1ReviewId;
    const filterTabs = '<div class="review-filter-tabs" role="tablist" aria-label="Review status filter">' +
      TASK1_REVIEW_STATUSES.map(([value, label]) =>
        `<button class="review-filter-tab ${state.task1ReviewFilter === value ? 'active' : ''}" data-review-filter="${value}" type="button">${escapeHtml(label)}</button>`
      ).join('') + '</div>';
    const summary = `<div class="ltab-summary">${rows.length} chart question${rows.length === 1 ? '' : 's'} · review state only; serving state is unchanged</div>`;
    if (!rows.length) {
      host.innerHTML = filterTabs + summary + '<div class="col__empty">No questions in this review filter.</div>';
      wireTask1ReviewFilters(host);
      return;
    }

    const list = rows.map(row => `
      <div class="lrow task1-review-row ${row.question_id === selectedId ? 'selected' : ''}" data-review-id="${escapeHtml(row.question_id)}" role="button" tabindex="0">
        <div class="lrow__time">${escapeHtml(row.task1_subtype || 'task1')}</div>
        <div class="lrow__main">
          <div class="lrow__title">${escapeHtml(truncate(row.prompt, 74))}</div>
          <div class="lrow__meta">${escapeHtml(row.question_id || '—')} · ${escapeHtml(row.preview_kind || 'none')} · ${escapeHtml(row.serving_state || 'unknown')}</div>
        </div>
        <div><span class="badge ${reviewStatusClass(row.review_status)}">${escapeHtml(reviewStatusLabel(row.review_status))}</span></div>
      </div>`).join('');

    host.innerHTML = filterTabs + summary + `<div class="task1-review-layout"><div class="task1-review-list">${list}</div><div class="task1-review-detail" id="task1-review-detail"></div></div>`;
    wireTask1ReviewFilters(host);
    host.querySelectorAll('[data-review-id]').forEach(row => {
      row.addEventListener('click', () => {
        state.selectedTask1ReviewId = row.dataset.reviewId;
        renderTask1ReviewQueue();
      });
      row.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          state.selectedTask1ReviewId = row.dataset.reviewId;
          renderTask1ReviewQueue();
        }
      });
    });
    renderTask1ReviewDetail(rows.find(row => row.question_id === selectedId) || rows[0]);
  }

  function wireTask1ReviewFilters(host) {
    host.querySelectorAll('[data-review-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.task1ReviewFilter = btn.dataset.reviewFilter;
        loadTask1Review();
      });
    });
  }

  function renderTask1ReviewDetail(row) {
    const detail = $('task1-review-detail');
    if (!detail || !row) return;
    const statusOptions = TASK1_REVIEW_STATUSES
      .filter(([value]) => value !== 'all')
      .map(([value, label]) => `<option value="${value}" ${row.review_status === value ? 'selected' : ''}>${escapeHtml(label)}</option>`).join('');
    const issueOptions = TASK1_REVIEW_ISSUES
      .map(([value, label]) => `<option value="${value}" ${String(row.review_issue || '') === value ? 'selected' : ''}>${escapeHtml(label)}</option>`).join('');
    const reviewAudit = row.reviewed_at
      ? `${escapeHtml(fmtDateTime(row.reviewed_at))} · ${escapeHtml(row.reviewed_by || 'server admin')}`
      : 'Not reviewed yet';
    detail.innerHTML = `
      <h2>${escapeHtml(row.task1_subtype || 'Task 1 chart')} · ${escapeHtml(row.question_id || '')}</h2>
      <div class="task1-review-prompt">${escapeHtml(row.prompt || '(no prompt)')}</div>
      <div class="detail-field"><div class="detail-field__label">Serving state</div><div class="detail-field__value">${escapeHtml(row.serving_state || 'unknown')} · unchanged by this review</div></div>
      <div class="detail-field"><div class="detail-field__label">Renderer preview</div><div class="task1-review-preview" id="task1-review-preview"></div></div>
      <div class="detail-field"><div class="detail-field__label">Stored chart source</div><pre class="task1-review-source">${escapeHtml(row.chart_description || '(no chart description)')}</pre></div>
      <div class="detail-field"><div class="detail-field__label">Review audit</div><div class="detail-field__value">${reviewAudit}</div></div>
      <div class="task1-review-form">
        <label>Status<select id="task1-review-status">${statusOptions}</select></label>
        <label>Issue category<select id="task1-review-issue">${issueOptions}</select></label>
        <label>Reviewer note<textarea id="task1-review-note" maxlength="2000">${escapeHtml(row.review_note || '')}</textarea></label>
        <button class="task1-review-save" id="task1-review-save" type="button">Save review</button>
        <div class="task1-review-result" id="task1-review-result" aria-live="polite"></div>
      </div>`;

    const preview = $('task1-review-preview');
    const renderer = window.BlabbyTask1ChartRenderer;
    let rendered = false;
    if (renderer && row.chart_data) rendered = renderer.renderPieChart(row.chart_data, preview);
    if (!rendered && renderer && row.chart_svg) rendered = renderer.renderLegacyChartImage(row.chart_svg, preview);
    if (!rendered) {
      const message = document.createElement('p');
      message.className = 'task1-review-preview-empty';
      message.textContent = row.preview_kind === 'renderer_unsupported'
        ? 'No deterministic preview: the stored multi-period shape is outside the current single-pie renderer contract.'
        : 'No safe renderer preview is available for this source.';
      preview.appendChild(message);
    }
    $('task1-review-save').addEventListener('click', () => saveTask1Review(row.question_id));
  }

  async function saveTask1Review(questionId) {
    const result = $('task1-review-result');
    const button = $('task1-review-save');
    const status = $('task1-review-status').value;
    const issue = $('task1-review-issue').value || null;
    const note = $('task1-review-note').value.trim() || null;
    if (status === 'needs_fix' && !issue) {
      result.textContent = 'Choose an issue category before marking Needs fix.';
      result.className = 'task1-review-result err';
      return;
    }
    button.disabled = true;
    result.textContent = 'Saving…';
    result.className = 'task1-review-result';
    try {
      const res = await fetch(`${API_BASE}/admin/writing/task1-review/${encodeURIComponent(questionId)}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${state.token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ review_status: status, review_issue: issue, review_note: note }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
      result.textContent = 'Saved. Serving state was not changed.';
      result.className = 'task1-review-result ok';
      await loadTask1Review();
    } catch (err) {
      result.textContent = `Failed: ${err.message}`;
      result.className = 'task1-review-result err';
      button.disabled = false;
    }
  }

  async function loadReadingAttempts() {
    const host = $('reading-content');
    host.innerHTML = '<div class="col__empty">Loading…</div>';
    try {
      const res = await fetch(`${API_BASE}/admin/reading/attempts`, {
        headers: { 'Authorization': `Bearer ${state.token}` },
      });
      if (!res.ok) {
        host.innerHTML = `<div class="col__empty">Failed to load (${res.status})</div>`;

  // === 總覽 Dashboard (handoff §3.1) ===
  // Reuses state.users (get_admin_users_full: email, is_pro_effective,
  // created_at, last_practice, practice_count) loaded at bootstrap, plus
  // GET /admin/practice-volume for the weekly bar + today/week cards.
  const _WEEKDAY_TC = ['日', '一', '二', '三', '四', '五', '六'];
  function daysSince(iso) {
    if (!iso) return Infinity;
    return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  }
  function relTime(iso) {
    if (!iso) return '—';
    const d = daysSince(iso);
    if (d <= 0) return '今天';
    if (d === 1) return '昨天';
    if (d < 7) return `${d} 天前`;
    if (d < 30) return `${Math.floor(d / 7)} 週前`;
    if (d < 365) return `${Math.floor(d / 30)} 個月前`;
    return `${Math.floor(d / 365)} 年前`;
  }

  async function loadDashboard() {
    const host = $('dashboard-content');
    host.innerHTML = '<div class="col__empty">Loading…</div>';
    try {
      if (!state.users || !state.users.length) await loadUsers();
      let days = [];
      try {
        const res = await fetch(`${API_BASE}/admin/practice-volume`, {
          headers: { 'Authorization': `Bearer ${state.token}` },
        });
        if (res.ok) {
          const body = await res.json();
          days = body.days || [];
        }
      } catch (e) {
        console.error('practice-volume fetch failed', e);
      }
      renderDashboard(state.users || [], days);
    } catch (err) {
      console.error('loadDashboard error', err);
      host.innerHTML = '<div class="col__empty">Network error</div>';
    }
  }

  function renderDashboard(users, days) {
    const host = $('dashboard-content');
    const total = users.length;
    const pro = users.filter(u => u.is_pro_effective).length;
    const free = total - pro;
    const todayVol = days.length
      ? (() => { const d = days[days.length - 1]; return (d.speaking || 0) + (d.writing || 0) + (d.reading || 0); })()
      : 0;
    const weekVol = days.reduce((s, d) => s + (d.speaking || 0) + (d.writing || 0) + (d.reading || 0), 0);

    const cards = [
      { label: '總用戶', value: total, sub: '', cls: '' },
      { label: 'PRO', value: pro, sub: total ? `${Math.round(pro / total * 100)}%` : '', cls: 'statcard--green' },
      { label: 'FREE', value: free, sub: '', cls: '' },
      { label: '今日練習', value: todayVol, sub: '口說+寫作+閱讀', cls: 'statcard--gold' },
      { label: '本週練習', value: weekVol, sub: '近 7 日', cls: '' },
    ].map(c => `
      <div class="statcard ${c.cls}">
        <div class="statcard__label">${c.label}</div>
        <div class="statcard__value">${c.value}</div>
        <div class="statcard__sub">${escapeHtml(c.sub)}</div>
      </div>`).join('');

    // Weekly bars — total volume per day, scaled to the busiest day.
    const totals = days.map(d => (d.speaking || 0) + (d.writing || 0) + (d.reading || 0));
    const maxVol = Math.max(1, ...totals);
    const bars = days.map((d, i) => {
      const t = totals[i];
      const h = Math.round(t / maxVol * 100);
      const isToday = i === days.length - 1;
      const wd = _WEEKDAY_TC[new Date(d.date + 'T00:00:00Z').getUTCDay()];
      return `
        <div class="dash-bar ${isToday ? 'today' : ''}">
          <div class="dash-bar__val">${t}</div>
          <div class="dash-bar__col" style="height:${h}%"></div>
          <div class="dash-bar__day">${wd}</div>
        </div>`;
    }).join('');

    // Recent active — practised at least once, newest first.
    const recent = users
      .filter(u => (u.practice_count || 0) > 0 && u.last_practice)
      .sort((a, b) => String(b.last_practice).localeCompare(String(a.last_practice)))
      .slice(0, 8);
    // Dormant — ≥ 7 days since last practice, coldest first. PRO flagged red.
    const dormant = users
      .filter(u => u.last_practice && daysSince(u.last_practice) >= 7)
      .sort((a, b) => daysSince(b.last_practice) - daysSince(a.last_practice))
      .slice(0, 8);

    const actrow = (u, dormantMode) => {
      const d = daysSince(u.last_practice);
      let timeCls = '';
      if (dormantMode && u.is_pro_effective) timeCls = d >= 21 ? 'danger' : 'warn';
      const plan = u.is_pro_effective ? '<span class="badge valid">PRO</span>' : '';
      return `
        <div class="actrow" data-uid="${escapeHtml(u.user_id || '')}">
          <div class="actrow__email">${escapeHtml(u.email || '(no email)')} ${plan}</div>
          <div class="actrow__time ${timeCls}">${relTime(u.last_practice)}</div>
        </div>`;
    };
    const recentHTML = recent.length ? recent.map(u => actrow(u, false)).join('') : '<div class="dash-empty">尚無活躍紀錄</div>';
    const dormantHTML = dormant.length ? dormant.map(u => actrow(u, true)).join('') : '<div class="dash-empty">無沉睡用戶</div>';

    host.innerHTML = `
      <div class="dash">
        <div class="dash-stats">${cards}</div>
        <div class="dash-section">
          <div class="dash-section__title">本週練習量</div>
          <div class="dash-bars">${bars || '<div class="dash-empty">尚無資料</div>'}</div>
        </div>
        <div class="dash-cols">
          <div class="dash-section">
            <div class="dash-section__title">最近活躍</div>
            ${recentHTML}
          </div>
          <div class="dash-section">
            <div class="dash-section__title">沉睡名單（≥ 7 日）</div>
            ${dormantHTML}
          </div>
        </div>
      </div>`;

    // Deep-link: clicking a student jumps to 會員管理 with them selected.
    host.querySelectorAll('.actrow').forEach(row => {
      row.addEventListener('click', () => {
        const uid = row.dataset.uid;
        if (!uid) return;
        activateTab('users');
        selectUser(uid);
      });
    });
  }

Drill prompt v1-v6
光有 Drill 不夠，AI 的批改準確率只有 30%。花了六個版本把它推到 80%。每一個版本都是真實 transcript 測試出來的，不是猜的。

Backend schema validation + retry layer
只靠 prompt 要求 AI 輸出正確格式是不夠的。加了 backend 驗證層，錯了就重試，重試失敗就 503。規則：schema 保護必須是結構性的，不能只靠 prompt。

  function renderChangelog() {
    const root = $('changelog-content');
    if (!root) return;

    const versions = CHANGELOG.split(/\n---\n/).map(s => s.trim()).filter(Boolean);
    const html = versions.map(block => {
      const lines = block.split('\n');
      const headerLine = (lines[0] || '').trim();
      // Header parts: split first " — " to get version + (date · subtitle).
      const dashIdx = headerLine.indexOf(' — ');
      let ver = headerLine, rest = '';
      if (dashIdx !== -1) {
        ver = headerLine.slice(0, dashIdx);
        rest = headerLine.slice(dashIdx + 3);
      }

      // Walk remaining lines, group into [title, description] pairs.
      // A blank line terminates the current feature; the next non-blank
      // becomes the next title.
      const features = [];
      let cur = null; // {title, descLines: []}
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        if (!line.trim()) {
          if (cur) { features.push(cur); cur = null; }
          continue;
        }
        if (!cur) { cur = { title: line.trim(), descLines: [] }; }
        else { cur.descLines.push(line); }
      }
      if (cur) features.push(cur);

      const featuresHtml = features.map(f => `
        <div class="changelog__feature">
          <div class="changelog__title">${escapeHtml(f.title)}</div>
          ${f.descLines.length
            ? `<div class="changelog__desc">${escapeHtml(f.descLines.join('\n'))}</div>`
            : ''}
        </div>
      `).join('');

      return `
        <section class="changelog__version">
          <div class="changelog__head">
            <span class="changelog__ver">${escapeHtml(ver)}</span>
            ${rest ? `<span class="changelog__date">${escapeHtml(rest)}</span>` : ''}
          </div>
          ${featuresHtml}
        </section>
      `;
    }).join('');
    root.innerHTML = html;
  }

  // === Subscriptions ===
  function fmtDay(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleDateString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric',
      });
    } catch (_) { return iso; }
  }
  function daysUntil(iso) {
    if (!iso) return null;
    try {
      const ms = new Date(iso).getTime() - Date.now();
      return Math.ceil(ms / 86400000);
    } catch (_) { return null; }
  }

  async function callProGrant(userId, granted, reason, expiresAt) {
    // expiresAt: ISO datetime string (e.g. "2026-06-15T00:00:00.000Z"),
    // null/undefined means permanent. On revoke (granted=false), it's ignored
    // server-side (backend always clears the expiry).
    const r = await fetch(`${API_BASE}/admin/user/${userId}/pro_grant`, {
        method: 'PATCH',
        headers: {
            'Authorization': `Bearer ${state.token}`,
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ granted, reason, expires_at: expiresAt ?? null }),
    });
    if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.detail || `HTTP ${r.status}`);
    }
    return r.json();
  }

  let _subsSelectedUserId = null;
  const _subsActionLog = [];

  window.selectSubsUser = function(userId) {
    _subsSelectedUserId = userId;
    const user = (state.users || []).find(u => u.user_id === userId);
    const middle = document.getElementById('subs-middle-content');
    if (!middle) return;
    if (!user) {
      middle.innerHTML = '<div class="col__empty">User not found.</div>';
      return;
    }

    // Field-name fallback chain — get_admin_users_full RPC has 3 historical
    // versions (v1: is_pro/practice_count/last_practice, v2: is_pro_paid/
    // is_pro_effective + grant audit columns, v3: adds pro_grant_expires_at).
    // Try the latest first so UI works against any deployed migration.
    const isPaid    = user.is_pro_paid ?? user.is_pro ?? false;
    const isGranted = user.is_pro_grant === true;
    const grantAt      = user.pro_grant_at;
    const grantReason  = user.pro_grant_reason;
    const grantBy      = user.pro_grant_by;
    const grantExpires = user.pro_grant_expires_at || null;

    // Expiry-aware effective Pro: a granted+expired user is NOT effectively Pro.
    // Trust server's is_pro_effective if available, else compute locally as fallback.
    const grantExpired = isGranted && grantExpires
      ? (new Date(grantExpires).getTime() <= Date.now())
      : false;
    const isPro = user.is_pro_effective ?? (isPaid || (isGranted && !grantExpired));

    // Status badge: 3 states — PRO (active) / 已到期 (granted but past expiry) / FREE
    let statusBadge;
    if (isPro) {
      statusBadge = `<span class="subs-status-badge subs-status-badge--pro">✦ PRO</span>`;
    } else if (grantExpired) {
      statusBadge = `<span class="subs-status-badge subs-status-badge--expired">已到期</span>`;
    } else {
      statusBadge = `<span class="subs-status-badge subs-status-badge--free">FREE</span>`;
    }

    // Grant-line summary below badge: granted users see expiry + grant origin.
    const expiryLabel = (e) => e ? `到期：${escapeHtml(fmtDateTime(e))}` : '永久';
    let proGrantLine = '';
    if (isGranted) {
      const bits = [];
      bits.push(expiryLabel(grantExpires));
      if (grantAt) bits.push(`Granted ${escapeHtml(fmtDateTime(grantAt))}`);
      if (grantBy) bits.push(`by ${escapeHtml(grantBy)}`);
      proGrantLine = `<div class="subs-info__grant-line">${bits.join(' · ')}${grantReason ? ` · "${escapeHtml(grantReason)}"` : ''}</div>`;
    } else if (isPro && isPaid) {
      proGrantLine = `<div class="subs-info__grant-line">Active paid subscription</div>`;
    }

    // === Section 2: action area ===
    let actionHTML = '';
    // Show revoke flow whenever the row carries a manual grant (active OR expired)
    // so admin can still tidy up. Paid-only members can also receive a grant.
    if (isGranted) {
      // PRO user OR expired grant: audit info box + revoke button
      const auditBox = isGranted ? `
        <div class="subs-pro-info">
          ${grantAt      ? `<div class="subs-pro-info__row"><span class="subs-pro-info__row-label">Granted</span> <span class="subs-pro-info__row-value">${escapeHtml(fmtDateTime(grantAt))}</span></div>` : ''}
          ${grantBy      ? `<div class="subs-pro-info__row"><span class="subs-pro-info__row-label">By</span> <span class="subs-pro-info__row-value">${escapeHtml(grantBy)}</span></div>` : ''}
          ${grantReason  ? `<div class="subs-pro-info__row"><span class="subs-pro-info__row-label">Reason</span> <span class="subs-pro-info__row-value">${escapeHtml(grantReason)}</span></div>` : ''}
          <div class="subs-pro-info__row"><span class="subs-pro-info__row-label">Expiry</span> <span class="subs-pro-info__row-value">${expiryLabel(grantExpires)}${grantExpired ? ' (已過期)' : ''}</span></div>
        </div>
      ` : '';
      actionHTML = `
        ${auditBox}
        <button class="subs-action__revoke" id="subs-revoke-btn" type="button">撤銷人工 Pro 授權</button>
      `;
    } else {
      // No manual grant: trigger button → expand inline form
      actionHTML = `
        <button class="subs-action__upgrade" id="subs-upgrade-trigger" type="button">授予人工 Pro</button>
        <div class="subs-grant-form" id="subs-grant-form">
          <label class="subs-grant-form__label" for="subs-reason-input">Reason for grant (required)</label>
          <input class="subs-grant-form__input" type="text" id="subs-reason-input" placeholder="e.g. early access, content creator, refund">
          <label class="subs-grant-form__label">Expiry</label>
          <div class="subs-expiry-options" id="subs-expiry-options">
            <button class="subs-expiry-pill" data-expiry="7"        type="button">7 天</button>
            <button class="subs-expiry-pill" data-expiry="30"       type="button">30 天</button>
            <button class="subs-expiry-pill active" data-expiry="0" type="button">永久</button>
            <button class="subs-expiry-pill" data-expiry="custom"   type="button">自訂</button>
          </div>
          <input class="subs-grant-form__input subs-expiry-custom" type="date" id="subs-expiry-custom-input">
          <button class="subs-grant-form__confirm" id="subs-grant-btn" type="button">確認授予 Pro</button>
          <button class="subs-grant-form__cancel" id="subs-cancel-link" type="button">Cancel</button>
        </div>
      `;
    }

    middle.innerHTML = `
      <div class="subs-detail">
        <div class="subs-info">
          <h2>方案與權限</h2>
          ${statusBadge}
          <div class="subs-info__grant-line">權限來源：${isPaid && isGranted && !grantExpired ? 'subscription + grant' : isPaid ? 'subscription' : isGranted && !grantExpired ? 'grant' : 'none'}</div>
          ${proGrantLine}
          <p class="member-note">人工授權與付費訂閱分開管理。撤銷人工授權不會取消付費訂閱。</p>
        </div>
        <div class="subs-action">
          ${actionHTML}
          <div class="subs-result" id="subs-pro-result"></div>
        </div>
      </div>
    `;

    // Wire interactions
    const upgradeBtn = document.getElementById('subs-upgrade-trigger');
    const grantForm  = document.getElementById('subs-grant-form');
    const cancelBtn  = document.getElementById('subs-cancel-link');
    const reasonInp  = document.getElementById('subs-reason-input');
    const grantBtn   = document.getElementById('subs-grant-btn');
    const revokeBtn  = document.getElementById('subs-revoke-btn');

    if (upgradeBtn && grantForm) {
      upgradeBtn.addEventListener('click', () => {
        grantForm.classList.add('is-open');
        upgradeBtn.style.display = 'none';
        if (reasonInp) reasonInp.focus();
      });
    }
    if (cancelBtn && grantForm && upgradeBtn) {
      cancelBtn.addEventListener('click', () => {
        grantForm.classList.remove('is-open');
        upgradeBtn.style.display = '';
        if (reasonInp) reasonInp.value = '';
        const result = document.getElementById('subs-pro-result');
        if (result) { result.textContent = ''; result.className = 'subs-result'; }
      });
    }
    // Expiry pill toggle — exactly one .active at a time. "自訂" reveals the
    // date input; the others hide it. Default "永久" (data-expiry="0") starts active.
    const expiryOpts   = document.getElementById('subs-expiry-options');
    const expiryCustom = document.getElementById('subs-expiry-custom-input');
    if (expiryOpts) {
      expiryOpts.querySelectorAll('.subs-expiry-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          expiryOpts.querySelectorAll('.subs-expiry-pill').forEach(p =>
            p.classList.toggle('active', p === pill));
          if (expiryCustom) {
            expiryCustom.classList.toggle('is-shown', pill.dataset.expiry === 'custom');
            if (pill.dataset.expiry === 'custom') expiryCustom.focus();
          }
        });
      });
    }
    if (grantBtn) grantBtn.addEventListener('click', subsGrantPro);
    if (revokeBtn) revokeBtn.addEventListener('click', subsRevokePro);
  };

  // Read selected expiry option and translate to ISO datetime (or null).
  // 0      → null (permanent)
  // 7/30   → now + N days, ISO UTC
  // custom → date picker value at 00:00 local → ISO UTC
  // Returns { expiresAt: string|null, error: string|null }.
  function subsComputeExpiresAt() {
    const active = document.querySelector('#subs-expiry-options .subs-expiry-pill.active');
    if (!active) return { expiresAt: null, error: null };
    const opt = active.dataset.expiry;
    if (opt === '0') return { expiresAt: null, error: null };
    if (opt === '7' || opt === '30') {
      const days = parseInt(opt, 10);
      const dt = new Date(Date.now() + days * 86400 * 1000);
      return { expiresAt: dt.toISOString(), error: null };
    }
    if (opt === 'custom') {
      const v = document.getElementById('subs-expiry-custom-input')?.value;
      if (!v) return { expiresAt: null, error: '請選擇自訂到期日' };
      const dt = new Date(v + 'T00:00:00');
      if (isNaN(dt.getTime())) return { expiresAt: null, error: '無效日期格式' };
      if (dt.getTime() <= Date.now()) return { expiresAt: null, error: '到期日必須在未來' };
      return { expiresAt: dt.toISOString(), error: null };
    }
    return { expiresAt: null, error: null };
  }

  function subsAppendLog(verb, email, reason, userId) {
    _subsActionLog.unshift({
      when: new Date().toISOString(),
      verb, email, reason, userId,
    });
    subsRenderActionLog();
  }

  function subsRenderActionLog() {
    const log = document.getElementById('subs-action-log');
    if (!log) return;
    const entries = _subsActionLog.filter(entry => entry.userId === state.selectedUserId);
    if (entries.length === 0) {
      log.innerHTML = '<div class="col__empty">No actions yet.</div>';
      return;
    }
    log.innerHTML = entries.map(e => `
      <div class="subs-action-item">
        <div class="subs-action-item__when">${escapeHtml(fmtDateTime(e.when))}</div>
        <div class="subs-action-item__what">
          <span class="verb-${e.verb}">${e.verb === 'grant' ? 'GRANTED' : 'REVOKED'}</span>
          ${escapeHtml(e.email || '—')}
        </div>
        ${e.reason ? `<div class="subs-action-item__reason">"${escapeHtml(e.reason)}"</div>` : ''}
      </div>
    `).join('');
  }

  async function subsGrantPro() {
    const reasonInput = document.getElementById('subs-reason-input');
    const result      = document.getElementById('subs-pro-result');
    const btn         = document.getElementById('subs-grant-btn');
    const reason      = (reasonInput?.value || '').trim();
    if (!reason) {
      if (result) { result.textContent = 'Reason is required.'; result.className = 'subs-result err'; }
      return;
    }
    const { expiresAt, error: expiryError } = subsComputeExpiresAt();
    if (expiryError) {
      if (result) { result.textContent = expiryError; result.className = 'subs-result err'; }
      return;
    }
    if (btn) { btn.disabled = true; btn.textContent = 'Granting…'; }
    const userId = _subsSelectedUserId;
    const epoch = state.memberEpoch;
    try {
      const user = (state.users || []).find(u => u.user_id === userId);
      await callProGrant(userId, true, reason, expiresAt);
      window.analytics?.track('admin_pro_granted', { user_id: userId, expires_at: expiresAt });
      subsAppendLog('grant', user?.email || userId, reason, userId);
      if (result) { result.textContent = '✓ Pro access granted.'; result.className = 'subs-result ok'; }
      await refreshMemberEntitlement(userId, epoch);
    } catch (err) {
      if (result) { result.textContent = `Failed: ${err.message}`; result.className = 'subs-result err'; }
      if (btn) { btn.disabled = false; btn.textContent = '確認授予 Pro'; }
    }
  }

  async function subsRevokePro() {
    if (!confirm('確定撤銷此會員的人工 Pro 授權？付費訂閱不受影響。')) return;
    const result = document.getElementById('subs-pro-result');
    const btn    = document.getElementById('subs-revoke-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Revoking…'; }
    const userId = _subsSelectedUserId;
    const epoch = state.memberEpoch;
    try {
      const user = (state.users || []).find(u => u.user_id === userId);
      await callProGrant(userId, false, 'admin revoke');
      window.analytics?.track('admin_pro_revoked', { user_id: userId });
      subsAppendLog('revoke', user?.email || userId, null, userId);
      if (result) { result.textContent = '✓ Pro access revoked.'; result.className = 'subs-detail__result'; }
      await refreshMemberEntitlement(userId, epoch);
    } catch (err) {
      if (result) { result.textContent = `Failed: ${err.message}`; result.className = 'subs-detail__result err'; }
      if (btn) { btn.disabled = false; btn.textContent = '撤銷人工 Pro 授權'; }
    }
  }

  async function extendSub(subId, btn) {
    if (!confirm('延長此訂閱 30 天、恢復 active，並授予同期限的人工 Pro？')) return;
    const userId = state.selectedUserId;
    const epoch = state.memberEpoch;
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = '處理中…';
    try {
      const res = await fetch(`${API_BASE}/api/admin/subscription/extend`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${state.token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ subscription_id: subId, days: 30 }),
      });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        alert(j.detail || '延長失敗');
        btn.disabled = false; btn.textContent = original;
        return;
      }
      // Reload list so the row reflects the new expires_at.
      await refreshMemberEntitlement(userId, epoch);
    } catch (_) {
      alert('Network error');
      btn.disabled = false; btn.textContent = original;
    }
  }

  async function cancelSub(subId, btn) {
    if (!confirm('確定取消這筆訂閱？用戶會繼續享有 Pro 直到 expires_at。')) return;
    const userId = state.selectedUserId;
    const epoch = state.memberEpoch;
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = '處理中…';
    try {
      const res = await fetch(`${API_BASE}/api/admin/subscription/cancel`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${state.token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ subscription_id: subId }),
      });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        alert(j.detail || '取消失敗');
        btn.disabled = false; btn.textContent = original;
        return;
      }
      await refreshMemberEntitlement(userId, epoch);
    } catch (_) {
      alert('Network error');
      btn.disabled = false; btn.textContent = original;
    }
  }

  boot();
})();
